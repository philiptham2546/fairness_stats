      var AI_USE_SOURCE_MARKERS = [
        'Classification tasks',
        'Natural Language Processing',
        'Algorithms (optimization)',
        'LLM & chatbots',
        'Recommendation systems',
        'Embodied systems',
        'Generative AI',
        'Benchmarking'
      ];

      function isLevel2SankeyLink(source) {
        return AI_USE_SOURCE_MARKERS.some(function(cat) {
          return source.indexOf(cat) !== -1;
        });
      }

      function getTotalCases(dataset) {
        var total = 0;
        for (var i = 0; i < dataset.length; i++) {
          total += dataset[i][2];
        }
        return total;
      }

      function getFairnessIssueLabelSet(dataset) {
        var set = {};
        for (var i = 0; i < dataset.length; i++) {
          if (isLevel2SankeyLink(dataset[i][0])) {
            set[dataset[i][1]] = true;
          }
        }
        return set;
      }

      function getFairnessIssuesWithCounts(dataset) {
        var fairnessMap = {};

        for (var i = 0; i < dataset.length; i++) {
          var source = dataset[i][0];
          var dest = dataset[i][1];
          var weight = dataset[i][2];

          if (isLevel2SankeyLink(source)) {
            if (!fairnessMap[dest]) {
              fairnessMap[dest] = 0;
            }
            fairnessMap[dest] += weight;
          }
        }

        return fairnessMap;
      }

      function getAiUseDestCountsFromLevel1(dataset) {
        var map = {};
        for (var i = 0; i < dataset.length; i++) {
          var source = dataset[i][0];
          var dest = dataset[i][1];
          var weight = dataset[i][2];
          if (!isLevel2SankeyLink(source)) {
            map[dest] = (map[dest] || 0) + weight;
          }
        }
        return map;
      }

      function tooltipTitleLevel1(industryName, useCaseName) {
        return 'Mapping from ' + industryName + ' to AI use case of ' + useCaseName;
      }

      function tooltipTitleLevel2(fairnessIssueName) {
        return 'Mapping from AI use case to AI fairness issue of ' + fairnessIssueName;
      }

      function prependTooltipTitle(html, titleText) {
        var titleHtml =
          '<div style="font-size:12px;margin-bottom:8px;line-height:1.35;"><b>' +
          titleText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
          '</b></div>';
        return titleHtml + (html || '');
      }

      /**
       * Level 1: AI-use destinations get "(count, pct%)" of level-1 flow; tooltips get mapping title.
       * Level 2: fairness destinations get "(count, pct%)" of level-2 flow; sources use augmented AI
       * labels; tooltips get mapping title.
       */
      function augmentSankeyDatasetWithFairnessStats(dataset) {
        var aiWeights = getAiUseDestCountsFromLevel1(dataset);
        var totalL1 = 0;
        for (var k in aiWeights) {
          if (Object.prototype.hasOwnProperty.call(aiWeights, k)) {
            totalL1 += aiWeights[k];
          }
        }
        if (totalL1 <= 0) {
          totalL1 = 1;
        }

        var aiUseRename = {};
        for (var useName in aiWeights) {
          if (!Object.prototype.hasOwnProperty.call(aiWeights, useName)) continue;
          var c1 = aiWeights[useName];
          var p1 = Math.round((c1 / totalL1) * 100);
          aiUseRename[useName] = useName + ' (' + c1 + ', ' + p1 + '%)';
        }

        var fairnessMap = getFairnessIssuesWithCounts(dataset);
        var totalL2 = 0;
        for (var i = 0; i < dataset.length; i++) {
          if (isLevel2SankeyLink(dataset[i][0])) {
            totalL2 += dataset[i][2];
          }
        }
        if (totalL2 <= 0) {
          totalL2 = 1;
        }

        var fairnessRename = {};
        for (var fname in fairnessMap) {
          if (!Object.prototype.hasOwnProperty.call(fairnessMap, fname)) continue;
          var c2 = fairnessMap[fname];
          var p2 = Math.round((c2 / totalL2) * 100);
          fairnessRename[fname] = fname + ' (' + c2 + ', ' + p2 + '%)';
        }

        return dataset.map(function(row) {
          var r = row.slice();
          var src = r[0];
          var dst = r[1];
          var tip = r[3];

          if (!isLevel2SankeyLink(src)) {
            if (aiUseRename[dst]) {
              r[1] = aiUseRename[dst];
              r[3] = prependTooltipTitle(tip, tooltipTitleLevel1(src, dst));
            }
          } else {
            if (aiUseRename[src]) {
              r[0] = aiUseRename[src];
            }
            if (fairnessRename[dst]) {
              r[1] = fairnessRename[dst];
            }
            r[3] = prependTooltipTitle(tip, tooltipTitleLevel2(dst));
          }
          return r;
        });
      }

      function normalizeSankeyLabelText(s) {
        return (s || '').replace(/\s+/g, ' ').trim();
      }

      /**
       * Google Sankey places labels for nodes in the right half of the chart to the LEFT of
       * the node (w.x0 < width/2 → label on right; else on left). The rightmost column always
       * sits in the right half, so fairness labels overlap the middle column. Labels are not
       * grouped with rects in the same <g>, so we match <text> to right-column rects by
       * vertical overlap and shift x in the label's parent coordinate system.
       */
      function repositionFairnessIssueSankeyLabels(containerId, dataset) {
        var fairnessLabels = getFairnessIssueLabelSet(dataset);
        var container = document.getElementById(containerId);
        if (!container) return;

        var svg = container.querySelector('svg');
        if (!svg) {
          var iframe = container.querySelector('iframe');
          if (iframe && iframe.contentDocument) {
            svg = iframe.contentDocument.querySelector('svg');
          }
        }
        if (!svg) return;

        var rects = Array.prototype.slice.call(svg.querySelectorAll('rect'));
        var nodeRects = rects.filter(function(r) {
          var w = parseFloat(r.getAttribute('width'));
          var h = parseFloat(r.getAttribute('height'));
          if (isNaN(w) || isNaN(h)) return false;
          return w >= 2 && w <= 80 && h >= 3;
        });
        if (!nodeRects.length) return;

        var maxRight = nodeRects.reduce(function(acc, r) {
          return Math.max(acc, r.getBoundingClientRect().right);
        }, -Infinity);

        var colEps = 16;
        var rightColRects = nodeRects.filter(function(r) {
          return Math.abs(r.getBoundingClientRect().right - maxRight) <= colEps;
        });
        if (!rightColRects.length) return;

        var labelPad = 8;

        function textAnchorClientX(t, tbr) {
          var a = (t.getAttribute('text-anchor') || '').trim().toLowerCase();
          if (!a && typeof window.getComputedStyle === 'function') {
            a = (window.getComputedStyle(t).getPropertyValue('text-anchor') || '').trim().toLowerCase();
          }
          if (a === 'end') return tbr.right;
          if (a === 'middle') return tbr.left + tbr.width / 2;
          return tbr.left;
        }

        function shiftTextHorizToClientX(t, targetClientX) {
          // x / y on <text> and <tspan> are in this element's user space, not the parent's.
          var ctm = t.getScreenCTM && t.getScreenCTM();
          if (!ctm || typeof ctm.inverse !== 'function') return;

          var tbr = t.getBoundingClientRect();
          var tcy = tbr.top + tbr.height / 2;
          var fromX = textAnchorClientX(t, tbr);

          var ptFrom = svg.createSVGPoint();
          ptFrom.x = fromX;
          ptFrom.y = tcy;
          var ptTo = svg.createSVGPoint();
          ptTo.x = targetClientX;
          ptTo.y = tcy;

          var locFrom = ptFrom.matrixTransform(ctm.inverse());
          var locTo = ptTo.matrixTransform(ctm.inverse());
          var dx = locTo.x - locFrom.x;

          var wantPx = targetClientX - fromX;
          if (!isFinite(dx) || (Math.abs(wantPx) > 2 && Math.abs(dx) < 0.5)) {
            var sbr = svg.getBoundingClientRect();
            var sw = parseFloat(svg.getAttribute('width')) || svg.viewBox.baseVal.width || sbr.width;
            if (sbr.width > 0 && sw > 0) dx = wantPx * (sw / sbr.width);
            else dx = wantPx;
          }

          t.setAttribute('text-anchor', 'start');
          var tspans = t.querySelectorAll('tspan');
          if (tspans.length) {
            var ts0 = tspans[0];
            var ox = parseFloat(ts0.getAttribute('x'));
            if (isNaN(ox)) ox = parseFloat(t.getAttribute('x'));
            if (isNaN(ox)) ox = locFrom.x;
            t.removeAttribute('x');
            ts0.setAttribute('x', String(ox + dx));
            ts0.setAttribute('text-anchor', 'start');
          } else {
            var ox = parseFloat(t.getAttribute('x'));
            if (!isNaN(ox)) t.setAttribute('x', String(ox + dx));
            else t.setAttribute('x', String(locTo.x));
          }
        }

        var texts = Array.prototype.slice.call(svg.querySelectorAll('text'));
        texts.forEach(function(t) {
          var label = normalizeSankeyLabelText(t.textContent);
          if (!fairnessLabels[label]) return;

          var tbr = t.getBoundingClientRect();
          var tcy = tbr.top + tbr.height / 2;

          var best = null;
          var bestDist = Infinity;
          for (var j = 0; j < rightColRects.length; j++) {
            var r = rightColRects[j];
            var rbr = r.getBoundingClientRect();
            var rcy = rbr.top + rbr.height / 2;
            var d = Math.abs(rcy - tcy);
            if (d < bestDist) {
              bestDist = d;
              best = r;
            }
          }
          if (!best) return;

          shiftTextHorizToClientX(t, best.getBoundingClientRect().right + labelPad);
        });
      }

      /**
       * Google Sankey re-lays out labels on hover/tooltip; re-apply our fairness label positions.
       */
      function keepFairnessSankeyLabelsReanchored(chart, containerId, dataset) {
        var wrap = document.getElementById(containerId);
        if (!wrap) return;
        var svgEl = wrap.querySelector('svg');
        if (!svgEl) {
          var iframe = wrap.querySelector('iframe');
          if (iframe && iframe.contentDocument) {
            svgEl = iframe.contentDocument.querySelector('svg');
          }
        }
        if (!svgEl) return;

        var moOpts = {
          subtree: true,
          attributes: true,
          attributeFilter: ['x', 'y', 'text-anchor', 'transform']
        };

        var mo = null;

        function runWhileMoPaused() {
          if (mo) mo.disconnect();
          try {
            repositionFairnessIssueSankeyLabels(containerId, dataset);
          } finally {
            if (mo) mo.observe(svgEl, moOpts);
          }
        }

        if (typeof MutationObserver !== 'undefined') {
          var moTimer = null;
          mo = new MutationObserver(function() {
            if (moTimer) clearTimeout(moTimer);
            moTimer = setTimeout(function() {
              moTimer = null;
              runWhileMoPaused();
            }, 48);
          });
          mo.observe(svgEl, moOpts);
        }

        var hoverTimer = null;
        function onChartHover() {
          if (hoverTimer) clearTimeout(hoverTimer);
          hoverTimer = setTimeout(function() {
            hoverTimer = null;
            requestAnimationFrame(runWhileMoPaused);
            setTimeout(runWhileMoPaused, 60);
          }, 8);
        }
        google.visualization.events.addListener(chart, 'onmouseover', onChartHover);
        google.visualization.events.addListener(chart, 'onmouseout', onChartHover);
      }

      function drawSankey(dataset, containerId) {
        var displayDataset = augmentSankeyDatasetWithFairnessStats(dataset);
        var data = new google.visualization.DataTable();

        data.addColumn('string', 'Source');
        data.addColumn('string', 'Destination');
        data.addColumn('number', 'Weight');
        data.addColumn({type: 'string', role: 'tooltip', p: {html: true}});

        data.addRows(displayDataset);

        var chartHost = document.getElementById(containerId);
        var chartItem = chartHost ? chartHost.closest('.chart-item') : null;
        var innerW = chartItem ? chartItem.getBoundingClientRect().width : 640;
        var maxW = Math.floor(innerW - 32);
        var chartWidth = Math.max(340, Math.min(560, Math.round(maxW * 0.72)));
        var chartHeight = Math.max(280, Math.round(chartWidth * 0.48));

        var options = {
          width: chartWidth,
          height: chartHeight,
          sankey: {
            iterations: 40,
            node: {
              label: {
                fontSize: 12
              },
              interactivity: true,
              width: 10,
              labelPadding: 10,
              nodePadding: 6
            },
            link: {
              colorMode: 'gradient'
            }
          },
          tooltip: {
            isHtml: true
          }
        };

        var chart = new google.visualization.Sankey(chartHost);
        google.visualization.events.addListener(chart, 'ready', function() {
          function runReposition() {
            repositionFairnessIssueSankeyLabels(containerId, displayDataset);
          }
          runReposition();
          requestAnimationFrame(runReposition);
          setTimeout(runReposition, 80);
          keepFairnessSankeyLabelsReanchored(chart, containerId, displayDataset);
        });
        chart.draw(data, options);
      }

      function drawAllCharts() {
        document.getElementById('subtitle_corporate_america').textContent =
          'Total cases: ' + getTotalCases(corporate_america);
        document.getElementById('subtitle_public_sphere').textContent =
          'Total cases: ' + getTotalCases(public_sphere);
        document.getElementById('subtitle_internet_society').textContent =
          'Total cases: ' + getTotalCases(internet_society);

        drawSankey(corporate_america, 'chart_corporate_america');
        drawSankey(public_sphere, 'chart_public_sphere');
